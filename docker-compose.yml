# ============================================================================
# Dota Analyst — local dev docker compose
# Three services, two networks. Only `web` is exposed to the host.
#
#   ┌──────────┐    ┌──────────┐    ┌──────────┐
#   │   web    │───▶│ gateway  │───▶│ business │ (private)
#   │  :80     │    │  :8000   │    │  :8000   │
#   └──────────┘    └──────────┘    └──────────┘
#        ▲
#        │ :80
#        └─ host browser
#
# See ARCHITECTURE.md §2 for the rationale.
# ============================================================================

version: "3.9"

x-app-common: &app-common
  restart: unless-stopped
  env_file:
    - .env

services:
  # ------------------------------------------------------------------ web
  # nginx serving the static frontend. Only public-facing port.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: dota-analyst-web:0.1.0
    container_name: dota-web
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - frontend
    volumes:
      # v0.4.0.1: bind-mount the host's `web/public` over the image's
      # nginx document root so frontend changes (app.js / index.html /
      # style.css) take effect on the next container recreate without
      # rebuilding the image.  Without this, every frontend tweak
      # required `docker build` (~30 s) + container recreate + a
      # manual `docker cp` hack, which broke the v0.4.0-deploy
      # "edit-on-host, see-in-browser" loop.  The image's COPY'd
      # files still serve as the bootstrap content (a stale
      # `app.js` is the worst-case fallback if the host is empty).
      - ./web/public:/usr/share/nginx/html:rw
      # v0.4.0.1: bind-mount the nginx config too.  Without this,
      # changes to web/nginx.conf (security headers, HSTS,
      # X-Edge-Mode) would require a `docker build` + container
      # recreate.  nginx needs to be reloaded (not just restarted)
      # to pick up config changes — `docker compose up -d web` does
      # this implicitly because compose recreates the container,
      # which runs nginx fresh from the bind-mounted config.
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------------- gateway
  # Auth, rate limit, correlation IDs, body-size cap, reverse proxy.
  # Internal-only — only the `web` container (via nginx upstream) talks
  # to it, and only over the `frontend` network.
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: dota-analyst-gateway:0.1.0
    container_name: dota-gateway
    environment:
      - BUSINESS_URL=http://business:8000
      - DEV_API_KEY=${DEV_API_KEY}
      - CORS_ORIGINS=http://localhost
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-1048576}
      # v0.4.0.1: emit the `Secure` attribute on the session
      # cookie.  Set to "1" once the prod edge has TLS; default
      # "0" so the dev environment (http://localhost) still works.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
    volumes:
      # v0.4.0.1: bind-mount ./gateway so cookie / middleware /
      # auth-endpoint changes take effect on the next container
      # restart without rebuilding the image.  Same pattern as
      # the business service (cd352fe).
      - ./gateway:/app/gateway:rw
    depends_on:
      - business
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------- business
  # Heuristic engine + future ML. Internal-only. Not exposed to host.
  # Needs `external` network to reach DLTV/Steam/DatDota APIs.
  business:
    build:
      context: .
      dockerfile: docker/Dockerfile.business
    image: dota-analyst-business:0.1.0
    container_name: dota-business
    environment:
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - STRAZT_API_KEY=${STRAZT_API_KEY:-}
      - DATDOTA_API_KEY=${DATDOTA_API_KEY:-}
      - CORS_ORIGINS=http://gateway:8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - PREDICTION_ENGINE=${PREDICTION_ENGINE:-heuristic}
      # v0.3.15+: scraper is on by default.  Set to 0 in low-bandwidth
      # environments where dltv.org shouldn't be polled.
      - DLTV_SCRAPER_ENABLED=${DLTV_SCRAPER_ENABLED:-1}
      # v0.4.0-v17: opt-in v17 trained models (4 production models on
      # 603-match OpenDota pro corpus).  "1" routes _postmatch_prediction
      # through business/v17_predict.py instead of the legacy ml.engine.
      - V17_PREDICT=${V17_PREDICT:-0}
      # v0.4.1+: bookmaker odds.  Default is "stub" (no real
      # backend; the live card surfaces empty `predictions.odds`
      # blocks).  Set to one of the following to enable real
      # odds (see business/odds_backends.py for the full list):
      #   * "business.odds_backends.OddsApiIOBackend"
      #         Free tier: 100 req/hour + 2 bookmakers.  Needs
      #         ODDS_API_KEY in .env (sign up at odds-api.io).
      #         Recommended default — works from any network.
      #   * "business.odds_backends.BetBoomBackend"
      #         Russian-market only.  Needs BETBOOM_AUTH_TOKEN +
      #         BETBOOM_COOKIES in .env.betboom.  Live odds path
      #         is currently unreachable (fw-wc2.sportbook.bet
      #         parked; see notes in business/odds_backends.py).
      - ODDS_BACKEND=${ODDS_BACKEND:-stub}
      - ODDS_API_KEY=${ODDS_API_KEY:-}
      - ODDS_API_BOOKMAKERS=${ODDS_API_BOOKMAKERS:-}
      - ODDS_LIVE_POLL_SEC=${ODDS_LIVE_POLL_SEC:-60}
    env_file:
      # v0.4.1: BetBoom session creds.  The file is gitignored
      # (.env.* rule in .gitignore).  If the file is missing
      # or BETBOOM_AUTH_TOKEN is empty the backend logs a
      # warning and the live card surfaces empty odds.
      - .env.betboom
    networks:
      - backend
      - external
    volumes:
      # ml_data is large (200+ MB) and gitignored. Mount it from the host
      # so rebuilds don't redownload and the data survives container death.
      - ./ml_data:/app/ml_data:rw
      # v0.4.0-v17: bind-mount ./business so iterative code changes
      # (dltv_socket.py, v17_predict.py, board.py, ...) take effect on
      # the next container restart without rebuilding the image.
      # The image's /app/business/ files are still copied in by the
      # Dockerfile, but the host mount takes precedence at runtime.
      - ./business:/app/business:rw
      - ./business:/usr/local/lib/python3.12/site-packages/business:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    # No host exposure — purely internal
    internal: true
  external:
    # Bridge with internet access — used by `business` to reach
    # DLTV/Steam/DatDota upstream APIs. Keeps backend internal-only.
    driver: bridge
