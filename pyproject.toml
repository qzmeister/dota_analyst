[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dota-analyst"
version = "0.3.9"
description = "Professional Dota 2 draft analysis and outcome prediction system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dota Analyst contributors" },
]
keywords = ["dota2", "esports", "machine-learning", "draft-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies — kept in sync with requirements.txt
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "httpx>=0.27",   # used by the gateway service for async proxying
    # ML engine (0.2.0+). Imported transitively by business.app when
    # PREDICTION_ENGINE=ml, so they belong in the main image, not an
    # optional extra. joblib ships with scikit-learn but we pin it
    # because business.ml.storage uses it directly.
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
# `pip install -e ".[dev]"` for development
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# `pip install -e ".[ml]"` for offline training tooling (pandas for
# notebook-based exploration; not required at runtime).
ml = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
"Source" = "https://github.com/yourusername/dota_analyst"

# -----------------------------------------------------------------------------
# Setuptools config
# -----------------------------------------------------------------------------

[tool.setuptools]
# Three packages for 0.1.0+0.2.0: gateway (security + routing), business
# (heuristic + ML + data). `business.ml` is the ML subpackage — listed
# explicitly because we use a hand-curated `packages` list, not
# find-packages. `web` has no Python code — it's a static nginx bundle.
packages = ["gateway", "business", "business.ml"]

[tool.setuptools.package-data]
business = ["py.typed"]
gateway  = ["py.typed"]

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
# Coverage defaults (run `pytest --cov` to enable)
[tool.coverage.run]
source = ["business", "gateway"]
omit = [
    "business/__init__.py",
    "gateway/__init__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
precision = 1
