worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Security headers — applied to every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy         "no-referrer" always;
    # HSTS only over HTTPS (set when the prod edge enables TLS)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # API reverse-proxy — talks to the gateway. The gateway then
    # forwards to the business service. Browser only ever sees :80.
    upstream gateway {
        # In compose, the service is named "gateway".
        # For local dev (no compose), point at the host's gateway port.
        server gateway:8000 max_fails=3 fail_timeout=10s;
        # server 127.0.0.1:8000;  # local dev fallback
        keepalive 16;
    }

    server {
        listen       80 default_server;
        server_name  _;

        # Static frontend — files come from /usr/share/nginx/html/
        # (where Dockerfile.web copies web/public/*)
        root         /usr/share/nginx/html;
        index        index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|svg|png|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        # /api/* -> gateway -> business
        location /api/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Pass through our correlation header
            proxy_pass_header  X-Request-Id;
            proxy_read_timeout 30s;
        }

        # SSE stream — disable buffering, long timeout
        location /api/stream/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 24h;
        }

        # Health check for the edge (k8s/Compose probes)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Everything else -> index.html (SPA-friendly)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
