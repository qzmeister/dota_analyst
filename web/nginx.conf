worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

# v0.4.0.1: declare env vars we want to read inside `http {}`.
# nginx exports these as `$PROD_MODE` (string).  In dev (compose
# default), PROD_MODE is unset/empty → `map` defaults apply
# (inject dev key, permissive).  In prod (set `PROD_MODE=1` in
# the container env), the dev-key injection collapses to ""
# and the browser MUST log in via /api/auth/login.
env PROD_MODE;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Security headers — applied to every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy         "no-referrer" always;
    # v0.4.0.1: HSTS in prod.  The edge must be behind TLS for
    # this to do anything useful; an HSTS header over HTTP is
    # ignored by browsers, so we only enable it in prod mode.
    # `always` so the header sticks even on 4xx/5xx responses
    # (otherwise an attacker could downgrade the user's HSTS
    # state with a single 404).
    map "$PROD_MODE" $hsts_header {
        default "";
        1       "max-age=63072000; includeSubDomains";
    }
    add_header Strict-Transport-Security $hsts_header always;

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # API reverse-proxy — talks to the gateway. The gateway then
    # forwards to the business service. Browser only ever sees :80.
    upstream gateway {
        # In compose, the service is named "gateway".
        # For local dev (no compose), point at the host's gateway port.
        server gateway:8000 max_fails=3 fail_timeout=10s;
        # server 127.0.0.1:8000;  # local dev fallback
        keepalive 16;
    }

    # v0.3.17+: the gateway enforces X-API-Key on every /api/*
    # except the SSE bypass.  The static UI in web/public/app.js
    # doesn't (and shouldn't) embed a secret, so we inject the dev
    # key here at the edge.  This is safe ONLY because nginx is
    # the only public-facing component — anything reaching it has
    # already crossed the network boundary.
    #
    # `map` makes the substitution explicit: if the browser DID
    # supply an X-API-Key, we forward it as-is; if it didn't, we
    # inject the dev key.  nginx's `if` blocks inside `location`
    # are notoriously fragile, so we avoid them.
    #
    # For production / public deployment, edit this map to
    # `default $http_x_api_key;` so nginx only ever forwards a
    # key the browser actually sent.
    # v0.4.0.1: production toggle via env (PROD_MODE=1).  When
    # enabled, the default collapses to "" so nginx doesn't
    # inject the dev key — the browser MUST log in via
    # /api/auth/login to get a session cookie.  In dev (PROD_MODE
    # empty/unset), the default is the dev key, so the static
    # UI works out of the box without a login form.
    #
    # The decision lives in a single `map` (not chained `if`s
    # inside `location` — those are notoriously fragile) and
    # the variable is computed from BOTH the env and the
    # actual request header so a user who happens to provide
    # an X-API-Key still gets through in either mode.
    map "$PROD_MODE:$http_x_api_key" $effective_api_key {
        # dev (no PROD_MODE): inject dev key unless browser
        # sent one of its own.
        default                    "dev-local-dota-analyst-key-change-me";
        "~^:.{1,}"                 $http_x_api_key;
        # prod (PROD_MODE=1): pass through the browser's key
        # verbatim, never inject.
        "~^1:.{1,}"                $http_x_api_key;
        "~^1:$"                    "";
    }

    server {
        listen       80 default_server;
        server_name  _;

        # Static frontend — files come from /usr/share/nginx/html/
        # (where Dockerfile.web copies web/public/*)
        root         /usr/share/nginx/html;
        index        index.html;

        # Cache static assets aggressively (one year; version via ?v=)
        # NOTE: must not be `immutable` — a deploy that forgets the
        # ?v= query string would otherwise be cached for a year.
        # index.html is special: always re-validate so the latest
        # bundle pointers are picked up.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }
        location ~* \.(js|css|svg|png|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }

        # /api/* -> gateway -> business
        location /api/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Pass through our correlation header
            proxy_pass_header  X-Request-Id;
            # Inject the dev API key (see `map` above) so the static
            # UI doesn't need to know the secret.
            proxy_set_header   X-API-Key         $effective_api_key;
            proxy_read_timeout 30s;
        }

        # SSE stream — disable buffering, long timeout.
        # v0.4.0.1: also inject the dev X-API-Key.  In dev the
        # static UI doesn't have a session cookie yet (the
        # browser hasn't called POST /api/auth/login), so the
        # gateway's `COOKIE_AUTHED_PREFIXES` check would 401.
        # Injecting the dev key here keeps the EventSource
        # working in dev without forcing the user through a
        # login form.  For public deploy, set
        # `effective_api_key` to a sentinel (e.g. the empty
        # string) so this injection becomes a no-op and the
        # browser MUST log in to receive a session cookie.
        location /api/stream/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   X-API-Key         $effective_api_key;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 24h;
        }

        # Health check for the edge (k8s/Compose probes)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Everything else -> index.html (SPA-friendly)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
