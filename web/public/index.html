<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dota Analyst — Draft Board</title>
  <link rel="stylesheet" href="/style.css?v=0.3.25f" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▲</span>
      <div>
        <h1>Dota Analyst</h1>
        <span class="subtitle">Профессиональный анализ драфтов · patch 7.41d</span>
      </div>
    </div>
    <div class="controls">
      <div class="league-picker">
        <button id="leagueBtn" class="btn">Лиги <span id="leagueCount" class="badge">0</span> ▾</button>
        <div id="leaguePanel" class="league-panel hidden">
          <div class="panel-head">
            <input id="leagueSearch" type="text" placeholder="Поиск лиги…" />
          </div>
          <div id="leagueList" class="league-list"></div>
        </div>
      </div>
      <div class="league-picker watch-picker">
        <button id="watchBtn" class="btn">+ Матч <span id="watchCount" class="badge">0</span> ▾</button>
        <div id="watchPanel" class="league-panel hidden">
          <div class="panel-head">
            <input id="watchInput" type="text" placeholder="dltv.org/live/8910670427.json или steam id" />
            <button id="watchAddBtn" class="btn primary" style="margin-top:6px;width:100%">Добавить</button>
          </div>
          <div id="watchList" class="league-list"></div>
          <div class="watch-hint">Вставьте URL или steam_id матча, которого нет в выбранной лиге (обход DLTV v1 API).</div>
        </div>
      </div>
      <!-- v0.3.25f: auto-refresh is now a radio group (Вкл/Выкл)
           so the toggle is unambiguous on touch devices, and the
           same pattern carries the new theme switcher (Тёмная/Светлая). -->
      <div class="radio-group" role="radiogroup" aria-label="Авто-обновление">
        <span class="radio-label">Авто</span>
        <label class="radio-pill"><input type="radio" name="autoRefresh" id="autoRefreshOn" value="on" checked /><span>Вкл</span></label>
        <label class="radio-pill"><input type="radio" name="autoRefresh" id="autoRefreshOff" value="off" /><span>Выкл</span></label>
      </div>
      <div class="radio-group" role="radiogroup" aria-label="Тема оформления">
        <span class="radio-label">Тема</span>
        <label class="radio-pill"><input type="radio" name="theme" id="themeDark" value="dark" checked /><span>Тёмная</span></label>
        <label class="radio-pill"><input type="radio" name="theme" id="themeLight" value="light" /><span>Светлая</span></label>
      </div>
      <button id="refreshBtn" class="btn primary">Обновить</button>
    </div>
  </header>

  <div id="status" class="status"></div>

  <!-- v0.3.21: one-click top-league chips.  Rendered by app.js
       from /api/leagues' match_count; the most relevant filters
       are always one tap away, no need to open the picker. -->
  <div id="leagueChips" class="chips"></div>

  <main class="board">
    <section class="column" data-col="prematch">
      <div class="col-head prematch"><h2>Прематч</h2><span class="count" id="cnt-prematch">0</span></div>
      <div class="col-body" id="col-prematch"></div>
    </section>
    <section class="column" data-col="live">
      <div class="col-head live"><h2>Лайв</h2><span class="count" id="cnt-live">0</span></div>
      <div class="col-body" id="col-live"></div>
    </section>
    <section class="column" data-col="postmatch">
      <div class="col-head postmatch"><h2>Пост-матч</h2><span class="count" id="cnt-postmatch">0</span></div>
      <div class="col-body" id="col-postmatch"></div>
    </section>
  </main>

  <script src="/app.js?v=0.3.25h"></script>
</body>
</html>
